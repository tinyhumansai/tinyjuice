[package]
rust-version = "1.88"
name = "tinyjuice"
version = "0.11.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Pluggable token compression for OpenHuman."
repository = "https://github.com/tinyhumansai/tinyjuice"
readme = "README.md"
keywords = ["llm", "tokens", "compression", "openhuman", "context"]
categories = ["text-processing"]
autobins = false
exclude = [
    ".github/",
    ".gitmodules",
    "docs/",
    "vendor/tinyagents/",
    "crates/tinyjuice-examples/",
    "wiki/",
]

[workspace]
members = ["crates/tinyjuice-bus", "crates/tinyjuice-module", "crates/tinyjuice-drivers", "crates/tinyjuice-cli", "crates/tinyjuice-host"]
default-members = [".", "crates/tinyjuice-bus", "crates/tinyjuice-module", "crates/tinyjuice-drivers", "crates/tinyjuice-cli", "crates/tinyjuice-host"]
exclude = ["vendor/tinybus", "vendor/tinyagents", "crates/tinyjuice-examples"]
resolver = "3"

[dependencies]
# Optional adapter boundary: REPL ops as `tinytools::Tool` impls.
tinytools = { version = "0.6", git = "https://github.com/tinyhumansai/tinytools", rev = "41cc80ac9acf37a14f20be94f60ee552749f1540", optional = true }
anyhow = { version = "1", optional = true }
jaq-core = { version = "3", optional = true }
jaq-std = { version = "3", optional = true }
jaq-json = { version = "2", optional = true }
# The wire contract, defined once and shared with the module and with hosts.
# This crate re-exports its types from `src/types.rs` rather than declaring a
# second copy — see the note there.
tinyjuice-bus = { version = "0.11.0", path = "crates/tinyjuice-bus" }
async-trait = "0.1"
dirs = "7"
hex = "0.4"
log = "0.4"
once_cell = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "time"] }
unicode-segmentation = "1"
unicode-width = "0.2"

[dependencies.tree-sitter]
version = "0.26"
optional = true

[dependencies.tree-sitter-python]
version = "0.25"
optional = true

[dependencies.tree-sitter-rust]
version = "0.24"
optional = true

[dependencies.tree-sitter-typescript]
version = "0.23"
optional = true

[dev-dependencies]
criterion = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "test-util"] }

[[bench]]
name = "compression"
harness = false

[features]
default = ["tinyjuice-treesitter"]
# Exposes the REPL ops as `tinytools::Tool` impls (see src/repl/tools.rs).
tinytools = ["dep:tinytools", "dep:anyhow", "jq"]
# jq-style queries over JSON outputs (the `jq` REPL op and `juice_jq` tool).
jq = ["dep:jaq-core", "dep:jaq-std", "dep:jaq-json"]
tinyjuice-treesitter = [
    "dep:tree-sitter",
    "dep:tree-sitter-python",
    "dep:tree-sitter-rust",
    "dep:tree-sitter-typescript",
]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[[example]]
name = "repl_tool_schema"
required-features = ["tinytools"]

# Keep TinyBus identity consistent with the vendored module and storage proxy.
[patch."https://github.com/tinyhumansai/tinybus"]
tinybus = { path = "vendor/tinybus/crates/tinybus" }

# Use the TinyTools revision pinned by the nested TinyAgents checkout.
[patch."https://github.com/tinyhumansai/tinytools"]
tinytools = { path = "vendor/tinyagents/vendor/tinytools/crates/tinytools" }

# Resolve standalone module dependencies to the same vendored TinyBus checkout.
[patch.crates-io]
tinybus = { path = "vendor/tinybus/crates/tinybus" }
tinybus-module = { path = "vendor/tinybus/crates/tinybus-module" }
tinybus-macros = { path = "vendor/tinybus/crates/tinybus-macros" }
