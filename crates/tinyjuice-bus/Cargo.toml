[package]
rust-version = "1.88"
name = "tinyjuice-bus"
version = "0.10.5"
edition = "2024"
license = "GPL-3.0-only"
description = "The TinyBus wire contract for TinyJuice: member names, payload types, and the contract version."
repository = "https://github.com/tinyhumansai/tinyjuice"
readme = "README.md"
keywords = ["tinybus", "compression", "tokens", "contract"]
categories = ["data-structures"]
publish = false

# Deliberately transport-free: a host only needs this vocabulary to call the
# dynamic module, not TinyBus itself, a runtime, or the implementation crate.
[dependencies]
# The wire payloads are encoded into TinyBus JSON frames.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Shared REPL error vocabulary; no execution dependencies.
thiserror = "2"
# Optional (`storage` feature, off by default). Storage ports only (no I/O or runtime of its own): the schema the host composes
# lives in the contract so the host never links the implementation crate.
tinystoragedrivers-core = { version = "1.0.0", git = "https://github.com/tinyhumansai/tinystoragedrivers", tag = "v1.0.0", default-features = false, optional = true }

[features]
default = []
# `storage_schema()` for the host's schema composition. Hosts enable this.
storage = ["dep:tinystoragedrivers-core"]

[dev-dependencies]
# The migration tests run the schema over the in-memory backend.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
