[package]
name = "tinyjuice-module"
version = "0.2.2"
edition = "2024"
license = "GPL-3.0-only"
description = "Trusted TinyBus module adapter for TinyJuice."
repository = "https://github.com/tinyhumansai/tinyjuice"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
tinyjuice = { path = "../..", default-features = false }
tinybus = { version = "0.1.0", path = "../../vendor/tinybus/crates/tinybus", default-features = false, features = ["macros", "modules"] }
tinybus-module = { version = "0.1.0", path = "../../vendor/tinybus/crates/tinybus-module" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
