[package]
name = "tinyjuice-module"
version = "0.3.3"
edition = "2024"
license = "GPL-3.0-only"
description = "Trusted TinyBus module adapter for TinyJuice."
repository = "https://github.com/tinyhumansai/tinyjuice"
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[features]
static-link = []

[dependencies]
tinyjuice = { path = "../..", default-features = false }
# The interface vocabulary. Shared with hosts, so this adapter cannot drift
# from what a caller was compiled against.
tinyjuice-bus = { path = "../tinyjuice-bus" }
tinybus = { version = "=0.1.2", default-features = false, features = ["macros", "modules"] }
tinybus-module = "=0.1.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
