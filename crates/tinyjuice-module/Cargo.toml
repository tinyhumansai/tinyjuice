[package]
rust-version = "1.90"
name = "tinyjuice-module"
version = "0.11.4"
edition = "2024"
license = "GPL-3.0-only"
description = "Trusted TinyBus module adapter for TinyJuice."
repository = "https://github.com/tinyhumansai/tinyjuice"
publish = false

[features]
# Link this adapter into a host binary without exporting the shared C names.
static-link = []
linked = ["static-link"]

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
tinyjuice = { path = "../..", default-features = false, features = ["jq"] }
# The interface vocabulary. Shared with hosts, so this adapter cannot drift
# from what a caller was compiled against.
tinyjuice-bus = { path = "../tinyjuice-bus" }
tinybus = { version = "=0.3.6", git = "https://github.com/tinyhumansai/tinybus", rev = "6ce06bc674e4f4d718aa51e643ef62c1f372e270", default-features = false, features = ["macros", "modules"] }
tinybus-module = { version = "=0.3.6", git = "https://github.com/tinyhumansai/tinybus", rev = "6ce06bc674e4f4d718aa51e643ef62c1f372e270" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
serde_json = "1"
# The CCR store's durable tier is blobs on the host's storage ports, reached
# over the storage bus. The module has no storage backend or file of its own.
tinyjuice-drivers = { path = "../tinyjuice-drivers" }
tinystoragedrivers-api = { version = "2.1.0", git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "05eaada962decbab33bafa4763d2bd1a67f6b456" }
tinystoragedrivers-types = { version = "2.1.0", git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "05eaada962decbab33bafa4763d2bd1a67f6b456" }
tinystoragedrivers-busproxy = { version = "2.1.0", git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "05eaada962decbab33bafa4763d2bd1a67f6b456" }
log = "0.4"

[dev-dependencies]
# Tests serve the storage objects on the in-memory broker the module connects to.
tinystoragedrivers-testkit = { version = "2.1.0", git = "https://github.com/tinyhumansai/tinystoragedrivers", rev = "05eaada962decbab33bafa4763d2bd1a67f6b456" }
tinybus = { version = "=0.3.6", git = "https://github.com/tinyhumansai/tinybus", rev = "6ce06bc674e4f4d718aa51e643ef62c1f372e270", default-features = false, features = ["test-support"] }
tempfile = "3"
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
